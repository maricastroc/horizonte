<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #07070A; overflow: hidden; }
  a { color: #F0873F; text-decoration: none; }
  a:hover { color: #FFB07A; }
</style>
</helmet>

<div style="position:fixed;inset:0;background:#07070A;color:#E8E4DC;font-family:'JetBrains Mono',monospace;cursor:none;user-select:none;">

  <canvas ref="{{ glRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>

  <div style="position:absolute;left:34px;top:30px;display:flex;flex-direction:column;gap:6px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#8C867E;pointer-events:none;">
    <span style="color:#E8E4DC;">Horizonte</span>
    <span ref="{{ catRef }}">CAMPO A · 001</span>
  </div>

  <div style="position:absolute;right:34px;top:30px;text-align:right;display:flex;flex-direction:column;gap:6px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#8C867E;pointer-events:none;">
    <span ref="{{ stateRef }}">Repouso</span>
    <span style="color:#79736C;">Áudio simulado · arte gerada</span>
  </div>

  <div style="position:absolute;left:34px;bottom:28px;display:flex;gap:26px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8C867E;pointer-events:none;">
    <span>Clique / espaço — colapso</span>
    <span>N — fundir faixa</span>
    <span>Mover — massa do cursor</span>
  </div>

  <div style="position:absolute;right:34px;bottom:28px;font-size:10.5px;letter-spacing:.2em;color:#8C867E;pointer-events:none;">
    <span ref="{{ tcRef }}">00:00 / 04:12</span>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;intensidadeCampo&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Campo&quot;},&quot;grao&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Campo&quot;}}">
const TRACKS = [
  { cat: "CAMPO A · 001", artist: "OROVA", title: "Densidade", year: "2026", dur: 252, bpm: 88,
    inkA: [0.96, 0.53, 0.25], inkB: [0.29, 0.55, 0.72], seed: 7 },
  { cat: "CAMPO B · 014", artist: "MIRA SELVA", title: "Queda Livre", year: "2025", dur: 197, bpm: 104,
    inkA: [0.55, 0.78, 0.60], inkB: [0.86, 0.36, 0.42], seed: 31 }
];

const VERT = `attribute vec2 aP; void main(){ gl_Position = vec4(aP, 0.0, 1.0); }`;

const FRAG = `precision highp float;
uniform sampler2D uBack, uFront;
uniform vec2 uRes;
uniform vec4 uM0, uM1;
uniform vec3 uCur;
uniform vec3 uWave;
uniform float uSpin, uBlur, uTime, uFade, uGrain, uDisp, uJet;
uniform vec3 uInk;

float hash(vec2 p){ return fract(sin(dot(p, vec2(41.71, 289.13))) * 43758.5453); }

vec2 pullOf(vec2 p, vec4 m, float spin){
  vec2 d = p - m.xy;
  float r = max(length(d), 1e-4);
  float k = min(m.z / (r * r + 0.014), 0.85);
  vec2 dir = d / r;
  vec2 tang = vec2(-dir.y, dir.x);
  return -dir * k * 0.13 + tang * k * spin * 0.13;
}

float coreOf(vec2 p, vec4 m){
  if (m.w <= 0.0) return 0.0;
  float r = length(p - m.xy);
  return smoothstep(m.w, m.w * 0.87, r);
}

float rimOf(vec2 p, vec4 m){
  if (m.w <= 0.0) return 0.0;
  vec2 d = p - m.xy;
  float r = length(d);
  float band = exp(-pow((r - m.w * 1.01) / (m.w * 0.028), 2.0));
  float g = max(0.0, dot(normalize(d), normalize(vec2(-0.70, 0.71))));
  return band * pow(g, 3.5) * 1.25;
}

vec3 samp(sampler2D t, vec2 uv, vec2 off, float blur){
  vec3 c = vec3(0.0);
  for (int i = 0; i < 4; i++){
    float f = float(i) / 3.0;
    vec2 o = off * (1.0 + f * blur * 2.2);
    c.r += texture2D(t, uv + o * (1.0 + uDisp * 1.6)).r;
    c.g += texture2D(t, uv + o).g;
    c.b += texture2D(t, uv + o * (1.0 - uDisp * 1.6)).b;
  }
  return c / 4.0;
}

float alphaAt(sampler2D t, vec2 uv, vec2 off){ return texture2D(t, uv + off).a; }

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float aspect = uRes.x / uRes.y;
  vec2 p = (uv - 0.5) * vec2(aspect, 1.0);

  vec2 off = pullOf(p, uM0, uSpin) + pullOf(p, uM1, uSpin);
  off += pullOf(p, vec4(uCur.xy, uCur.z, 0.0), uSpin * 0.4);

  vec2 dw = p - uM0.xy;
  float rw = length(dw);
  float dr = rw - uWave.x;
  off += normalize(dw + 1e-5) * uWave.y * exp(-dr * dr * 42.0);

  vec2 offUv = off / vec2(aspect, 1.0);

  vec3 col = samp(uBack, uv, offUv, uBlur);

  float core = max(coreOf(p, uM0), coreOf(p, uM1));
  col = mix(col, vec3(0.0), core);
  col += uInk * (rimOf(p, uM0) + rimOf(p, uM1)) * 1.15;

  if (uJet > 0.001){
    vec2 jd = p - uM0.xy;
    float axis = abs(jd.x * 0.62 + jd.y * 0.78);
    float along = clamp(1.0 - abs(jd.x * 0.78 - jd.y * 0.62) * 0.7, 0.0, 1.0);
    col += uInk * exp(-axis * axis * 900.0) * along * uJet * 2.4;
  }

  vec2 fOff = offUv * 0.34;
  vec3 fCol = samp(uFront, uv, fOff, uBlur * 0.6);
  float fA = alphaAt(uFront, uv, fOff);
  col = mix(col, fCol, clamp(fA * 1.6, 0.0, 1.0));

  float cd = length(p - uCur.xy);
  col += uInk * exp(-cd * cd * 5200.0) * 0.55;

  col *= uFade;
  col += (hash(gl_FragCoord.xy + fract(uTime) * 91.3) - 0.5) * uGrain;

  gl_FragColor = vec4(col, 1.0);
}`;

class Component extends DCLogic {
  componentDidMount(){
    this.el = this._gl;
    this.mouse = { x: 0.72, y: 0.42, tx: 0.72, ty: 0.42, v: 0 };
    this.st = {
      mode: "repouso", a: 0, b: 1, mix: 0, play: 0, spin: 0.06, blur: 0,
      fade: 0, jet: 0, waveR: -1, waveA: 0, energy: 0.35, curK: 0,
      m0k: 0.055, m0h: 0.115, m1k: 0, m1h: 0, m1x: 1.4, m1y: 0.5,
      t: 0, pos: 0, seq: null, seqT: 0, spinT: 0.06
    };
    this.parts = [];
    for (let i = 0; i < 260; i++){
      this.parts.push({
        a: Math.random() * Math.PI * 2,
        r: 0.16 + Math.pow(Math.random(), 0.7) * 0.62,
        s: (0.12 + Math.random() * 0.5) * (Math.random() < 0.5 ? 1 : -1),
        z: Math.random(), tw: Math.random() * 6.28
      });
    }
    this.covers = TRACKS.map((t) => this.makeCover(t));
    this.rings = this.covers.map((c, i) => this.makeRing(c, i === 0 ? 0.64 : 0.58));
    this.setupGL();
    this.bind();
    document.fonts && document.fonts.load('700 200px Archivo').then(() => { this.fontsOK = true; });
    document.fonts && document.fonts.load('italic 400 120px "Bodoni Moda"');
    this.last = performance.now();
    this.loop = this.loop.bind(this);
    this.raf = requestAnimationFrame(this.loop);
  }

  componentWillUnmount(){
    cancelAnimationFrame(this.raf);
    window.removeEventListener("resize", this.onResize);
    window.removeEventListener("keydown", this.onKey);
    window.removeEventListener("pointermove", this.onMove);
    window.removeEventListener("pointerdown", this.onDown);
  }

  bind(){
    this.onResize = () => this.resize();
    this.onMove = (e) => {
      const w = window.innerWidth, h = window.innerHeight;
      const nx = e.clientX / w, ny = e.clientY / h;
      this.mouse.v = Math.min(1, this.mouse.v + Math.hypot(nx - this.mouse.tx, ny - this.mouse.ty) * 9);
      this.mouse.tx = nx; this.mouse.ty = ny;
    };
    this.onDown = () => this.togglePlay();
    this.onKey = (e) => {
      if (e.code === "Space"){ e.preventDefault(); this.togglePlay(); }
      if (e.key === "n" || e.key === "N" || e.key === "ArrowRight"){ e.preventDefault(); this.fuse(); }
    };
    window.addEventListener("resize", this.onResize);
    window.addEventListener("pointermove", this.onMove, { passive: true });
    window.addEventListener("pointerdown", this.onDown);
    window.addEventListener("keydown", this.onKey);
  }

  setupGL(){
    const c = this.el;
    const gl = c.getContext("webgl", { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: true });
    this.gl = gl;
    if (!gl) return;
    const mk = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    };
    const pr = gl.createProgram();
    gl.attachShader(pr, mk(gl.VERTEX_SHADER, VERT));
    gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(pr);
    gl.useProgram(pr);
    this.pr = pr;
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, "aP");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    this.u = {};
    ["uBack","uFront","uRes","uM0","uM1","uCur","uWave","uSpin","uBlur","uTime","uFade","uGrain","uDisp","uJet","uInk"]
      .forEach(n => { this.u[n] = gl.getUniformLocation(pr, n); });
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    this.texB = this.mkTex(); this.texF = this.mkTex();
    this.cvB = document.createElement("canvas"); this.ctxB = this.cvB.getContext("2d");
    this.cvF = document.createElement("canvas"); this.ctxF = this.cvF.getContext("2d");
    this.resize();
  }

  mkTex(){
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return t;
  }

  resize(){
    if (!this.gl) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.3);
    const w = Math.max(2, Math.round(window.innerWidth * dpr));
    const h = Math.max(2, Math.round(window.innerHeight * dpr));
    this.el.width = w; this.el.height = h;
    this.gl.viewport(0, 0, w, h);
    const cw = Math.min(w, 1760), ch = Math.round(cw * h / w);
    this.cvB.width = cw; this.cvB.height = ch;
    this.cvF.width = cw; this.cvF.height = ch;
    this.W = cw; this.H = ch;
  }

  makeCover(t){
    const S = 512, c = document.createElement("canvas");
    c.width = S; c.height = S;
    const x = c.getContext("2d");
    const A = `rgb(${t.inkA.map(v => Math.round(v * 255)).join(",")})`;
    const B = `rgb(${t.inkB.map(v => Math.round(v * 255)).join(",")})`;
    let s = t.seed;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    x.fillStyle = "#0A0910"; x.fillRect(0, 0, S, S);
    x.fillStyle = B;
    x.beginPath(); x.moveTo(0, S * 0.12); x.lineTo(S, 0); x.lineTo(S, S * 0.74); x.lineTo(0, S * 0.92); x.closePath(); x.fill();
    x.fillStyle = A;
    x.fillRect(S * 0.08, S * 0.30, S * 0.52, S * 0.44);
    x.fillStyle = "#0A0910";
    x.beginPath(); x.arc(S * 0.72, S * 0.40, S * 0.20, 0, 6.2832); x.fill();
    x.fillStyle = "#EDE7DC"; x.globalAlpha = 0.92;
    x.fillRect(0, S * 0.80, S, S * 0.055);
    x.globalAlpha = 1;
    for (let i = 0; i < 6; i++){
      const y = rnd() * S, hh = S * (0.012 + rnd() * 0.05);
      x.globalAlpha = 0.35 + rnd() * 0.5;
      x.fillStyle = rnd() > 0.5 ? "#0A0910" : (rnd() > 0.5 ? A : B);
      x.fillRect(-S * 0.1, y, S * 1.2, hh);
    }
    x.globalAlpha = 1;
    for (let i = 0; i < 900; i++){
      x.globalAlpha = 0.015 + rnd() * 0.05;
      x.fillStyle = rnd() > 0.5 ? "#F2EFE8" : "#000";
      x.fillRect(rnd() * S, rnd() * S, 1.6, 1.6);
    }
    x.globalAlpha = 1;
    return c;
  }

  togglePlay(){
    const s = this.st;
    if (s.mode === "repouso"){ s.mode = "colapso"; s.seqT = 0; }
    else if (s.mode === "toca"){ s.mode = "pausa"; }
    else if (s.mode === "pausa"){ s.mode = "toca"; }
  }

  fuse(){
    const s = this.st;
    if (s.mode === "fusao") return;
    s.prevMode = s.mode === "pausa" ? "toca" : s.mode;
    s.b = (s.a + 1) % TRACKS.length;
    s.mode = "fusao"; s.seqT = 0; s.mix = 0;
    const ang = -0.7;
    s.m1x = Math.cos(ang) * 1.5; s.m1y = Math.sin(ang) * 1.5;
    s.m1k = 0.03; s.m1h = 0.055;
  }

  loop(now){
    this.raf = requestAnimationFrame(this.loop);
    if (!this.gl) return;
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    this.step(dt);
    this.drawBack();
    this.drawFront();
    this.render();
    this.hud();
  }

  step(dt){
    const s = this.st;
    s.t += dt; s.seqT += dt;
    const K = (this.props.intensidadeCampo ?? 1);

    const m = this.mouse;
    m.x += (m.tx - m.x) * Math.min(1, dt * 5.2);
    m.y += (m.ty - m.y) * Math.min(1, dt * 5.2);
    m.v *= Math.pow(0.05, dt);
    s.curK = (0.006 + m.v * 0.020) * K;

    const tr = TRACKS[s.a];
    const beat = (s.t * tr.bpm) / 60;
    const bass = Math.exp(-6.5 * (beat - Math.floor(beat)));
    const mid = 0.5 + 0.5 * Math.sin(s.t * 1.7) * Math.sin(s.t * 0.63);
    const treb = Math.pow(Math.abs(Math.sin(s.t * 9.1) * Math.sin(s.t * 3.3)), 3);
    const live = s.mode === "toca" || s.mode === "fusao";
    s.energy += ((live ? 0.55 + bass * 0.45 : (s.mode === "pausa" ? 0.22 : 0.3)) - s.energy) * Math.min(1, dt * 4);

    let tgt = { m0k: 0.088 * K, m0h: 0.112, spin: 0.06, blur: 0, fade: 1, jet: 0, play: 0 };

    if (s.mode === "repouso"){
      tgt.fade = 1;
    } else if (s.mode === "colapso"){
      const p = s.seqT;
      if (p < 1.1){
        const e = p / 1.1;
        tgt.m0k = 0.055 + e * e * 0.30; tgt.m0h = 0.115 + e * 0.03;
        tgt.spin = 0.06 + e * 2.3; tgt.blur = e * 1.5; tgt.fade = 1 - Math.pow(e, 2.6);
      } else if (p < 1.3){
        tgt.m0k = 0.36; tgt.m0h = 0.10; tgt.spin = 2.4; tgt.blur = 1.5; tgt.fade = 0.03;
      } else if (p < 2.25){
        const e = (p - 1.3) / 0.95;
        tgt.m0k = 0.36 - e * 0.28; tgt.m0h = 0.10 - e * 0.02;
        tgt.spin = 2.4 - e * 2.1; tgt.blur = 1.5 * (1 - e);
        tgt.fade = Math.min(1, e * 1.9); tgt.jet = Math.sin(Math.min(1, e * 1.5) * Math.PI) * 1.1;
        tgt.play = e;
      } else { s.mode = "toca"; s.pos = 0; }
    }

    if (s.mode === "toca" || s.mode === "pausa"){
      const pa = s.mode === "toca" ? 1 : 0.86;
      tgt.play = pa;
      tgt.m0k = (0.075 + bass * 0.030 * (s.mode === "toca" ? 1 : 0.25)) * K;
      tgt.m0h = 0.082;
      tgt.spin = s.mode === "toca" ? 0.42 + mid * 0.14 : 0.06;
      tgt.jet = s.mode === "toca" ? 0.10 + bass * 0.22 : 0.02;
      tgt.blur = s.mode === "toca" ? bass * 0.12 : 0;
      if (s.mode === "toca") s.pos = Math.min(tr.dur, s.pos + dt);
    }

    if (s.mode === "fusao"){
      const p = s.seqT, base = s.prevMode === "toca" ? 1 : 0;
      tgt.play = base;
      if (p < 0.9){
        const e = p / 0.9, ee = e * e;
        const ang = -0.7 + ee * 5.4;
        const rad = 1.5 * (1 - ee) + 0.02;
        s.m1x = Math.cos(ang) * rad; s.m1y = Math.sin(ang) * rad;
        s.m1k = 0.03 + ee * 0.05; s.m1h = 0.055 + ee * 0.02;
        s.mix = e * 0.5;
        tgt.m0k = (base ? 0.075 : 0.055) + ee * 0.05;
        tgt.spin = (base ? 0.42 : 0.06) + ee * 0.9;
        tgt.blur = ee * 0.4;
        tgt.jet = base ? 0.1 : 0;
      } else if (p < 1.6){
        const e = (p - 0.9) / 0.7;
        if (s.waveR < 0){ s.waveR = 0.02; }
        s.m1k *= 0.72; s.m1h *= 0.80;
        s.mix = 0.5 + e * 0.5;
        tgt.m0k = (base ? 0.075 : 0.055) + (1 - e) * 0.08;
        tgt.spin = (base ? 0.42 : 0.06) + (1 - e) * 0.8;
        tgt.blur = (1 - e) * 0.25;
        tgt.jet = base ? 0.1 : 0.25 * (1 - e);
      } else {
        s.a = s.b; s.mix = 0; s.m1k = 0; s.m1h = 0; s.waveR = -1; s.pos = 0;
        s.mode = s.prevMode === "toca" ? "toca" : "repouso";
      }
    }

    if (s.waveR >= 0){
      s.waveR += dt * 2.1;
      s.waveA = 0.075 * Math.max(0, 1 - s.waveR / 2.3);
      if (s.waveR > 2.4) s.waveR = -1;
    } else s.waveA = 0;

    const k = Math.min(1, dt * 9);
    s.m0k += (tgt.m0k - s.m0k) * k;
    s.m0h += (tgt.m0h - s.m0h) * k;
    s.spin += (tgt.spin - s.spin) * k;
    s.blur += (tgt.blur - s.blur) * k;
    s.fade += (tgt.fade - s.fade) * Math.min(1, dt * 14);
    s.jet += (tgt.jet - s.jet) * k;
    s.play += (tgt.play - s.play) * Math.min(1, dt * 3.4);
    s.bass = bass; s.treb = treb; s.mid = mid;

    const pull = s.mode === "colapso" ? (s.seqT < 1.3 ? 1 : 0) : 0;
    for (const q of this.parts){
      q.a += dt * q.s * (0.25 + s.energy * 0.9) * (s.mode === "toca" ? 1.5 : 1);
      if (pull) q.r *= 1 - dt * 1.5;
      else q.r += ((0.16 + q.z * 0.62) - q.r) * dt * 1.2;
      if (s.mode === "pausa") q.r -= dt * 0.012;
    }
  }

  lockup(){
    const W = this.W, H = this.H, p = this.st.play;
    const size = W * (0.185 - p * 0.075);
    const ay = H * (0.605 + p * 0.03);
    return { size, ay, ty: ay + size * 0.50, tsize: size * 0.53, msize: W * 0.011 };
  }

  bodyXY(){
    const s = this.st;
    const restX = 0.615, restY = 0.425;
    const playX = 0.5 + 0.06 * Math.cos(s.t * 0.2), playY = 0.5;
    return { x: restX + (playX - restX) * s.play, y: restY + (playY - restY) * s.play };
  }

  drawBack(){
    const x = this.ctxB, W = this.W, H = this.H, s = this.st;
    const A = TRACKS[s.a], B = TRACKS[s.b];
    const bp = this.bodyXY(), bx = bp.x * W, by = bp.y * H;
    const inkA = (t, a) => `rgba(${t.inkA.map(v => Math.round(v * 255)).join(",")},${a})`;
    const inkB = (t, a) => `rgba(${t.inkB.map(v => Math.round(v * 255)).join(",")},${a})`;

    x.fillStyle = "#07070A"; x.fillRect(0, 0, W, H);

    const g = x.createRadialGradient(bx - W * 0.06, by, 0, bx, by, W * 0.62);
    g.addColorStop(0, inkA(A, 0.15 + s.energy * 0.07));
    g.addColorStop(0.45, inkB(A, 0.06));
    g.addColorStop(1, "rgba(7,7,10,0)");
    x.fillStyle = g; x.fillRect(0, 0, W, H);

    const R = Math.min(W, H) * (0.46 + s.play * 0.22);
    this.ring(x, s.a, bx, by, R, s.t * (0.05 + s.energy * 0.14), (1 - s.mix * 0.7) * (0.8 + s.play * 0.2));
    if (s.mix > 0) this.ring(x, s.b, bx, by, R * (1.18 - s.mix * 0.18), -s.t * 0.12 + 1.1, s.mix * 0.9);

    x.save();
    x.globalCompositeOperation = "lighter";
    for (const q of this.parts){
      const rr = q.r * Math.min(W, H) * 0.9;
      const px = bx + Math.cos(q.a) * rr * 1.25, py = by + Math.sin(q.a) * rr * 0.72;
      const tw = s.mode === "toca" ? 0.62 + 0.38 * Math.sin(q.tw + s.t * 5 + this.st.treb * 5) : 0.6;
      x.globalAlpha = (0.02 + q.z * 0.13) * tw * (0.5 + s.energy * 0.7);
      x.fillStyle = q.z > 0.6 ? inkA(A, 1) : "#CFCAC2";
      const sz = 1.1;
      x.fillRect(px, py, sz, sz);
    }
    x.restore();

    const lk = this.lockup(), artistSize = lk.size, ay = lk.ay;
    x.save();
    x.textBaseline = "alphabetic";
    if (x.letterSpacing !== undefined) x.letterSpacing = "-0.035em";
    x.font = `700 ${artistSize}px Archivo, sans-serif`;
    x.globalAlpha = (1 - s.mix) * (0.92 - s.play * 0.25);
    x.fillStyle = "#EFEBE3";
    x.fillText(A.artist, W * 0.028, ay);
    if (s.mix > 0){
      x.globalAlpha = s.mix * (0.92 - s.play * 0.25);
      x.fillText(B.artist, W * 0.028 + (1 - s.mix) * W * 0.12, ay + (1 - s.mix) * H * 0.05);
    }
    x.restore();

    if (s.play > 0.02){
      const bandH = H * 0.115 * s.play;
      x.save();
      x.globalAlpha = 0.34 * s.play;
      x.drawImage(this.covers[s.a], 0, H - bandH, W, bandH);
      if (s.mix > 0){ x.globalAlpha = 0.5 * s.play * s.mix; x.drawImage(this.covers[s.b], 0, H - bandH, W, bandH); }
      x.globalCompositeOperation = "destination-out";
      const fg = x.createLinearGradient(0, H - bandH, 0, H);
      fg.addColorStop(0, "rgba(0,0,0,1)"); fg.addColorStop(0.6, "rgba(0,0,0,0.15)"); fg.addColorStop(1, "rgba(0,0,0,0.55)");
      x.fillStyle = fg; x.fillRect(0, H - bandH, W, bandH);
      x.restore();
      const prog = Math.min(1, s.pos / TRACKS[s.a].dur);
      x.fillStyle = inkA(A, 0.85 * s.play);
      x.fillRect(0, H - 2, W * prog, 2);
    }

    const scrim = x.createLinearGradient(0, H * 0.885, 0, H);
    scrim.addColorStop(0, "rgba(7,7,10,0)"); scrim.addColorStop(0.55, "rgba(7,7,10,.62)"); scrim.addColorStop(1, "rgba(7,7,10,.88)");
    x.fillStyle = scrim; x.fillRect(0, H * 0.885, W, H * 0.115);

    this.upload(this.texB, this.cvB);
  }

  makeRing(cover, len){
    const RB = 1100, c = document.createElement("canvas");
    c.width = RB; c.height = RB;
    const x = c.getContext("2d");
    const C = RB / 2, Rin = C * 0.70, Rout = C * 0.95, th = Rout - Rin;
    const N = 300, S = 512, sw = S / N;
    const arc = (2 * Math.PI * Rin) / N;
    x.translate(C, C);
    for (let i = 0; i < N; i++){
      const t = i / N;
      if (t > len) continue;
      const f = Math.min(1, (len - t) / 0.13) * Math.min(1, t / 0.10);
      x.save();
      x.rotate(t * Math.PI * 2);
      x.globalAlpha = f;
      x.drawImage(cover, i * sw, 0, sw + 1.5, S, Rin, -arc * 1.6, th, arc * 3.2);
      x.restore();
    }
    x.globalCompositeOperation = "destination-in";
    const g = x.createRadialGradient(0, 0, Rin * 0.94, 0, 0, Rout);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.28, "rgba(0,0,0,1)");
    g.addColorStop(0.8, "rgba(0,0,0,.9)"); g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.beginPath(); x.arc(0, 0, Rout, 0, 6.2832); x.fill();
    const o = document.createElement("canvas");
    o.width = RB; o.height = RB;
    const ox = o.getContext("2d");
    ox.filter = "blur(1.4px)";
    ox.drawImage(c, 0, 0);
    return o;
  }

  ring(x, idx, cx, cy, R, rot, alpha){
    if (alpha <= 0.01) return;
    const buf = this.rings[idx];
    const scale = (R / (buf.width * 0.475)) * buf.width;
    x.save();
    x.globalCompositeOperation = "lighter";
    x.globalAlpha = alpha;
    x.translate(cx, cy);
    x.scale(1, 0.62);
    x.rotate(rot);
    x.drawImage(buf, -scale / 2, -scale / 2, scale, scale);
    x.restore();
  }

  drawFront(){
    const x = this.ctxF, W = this.W, H = this.H, s = this.st;
    const A = TRACKS[s.a], B = TRACKS[s.b];
    x.clearRect(0, 0, W, H);
    const lk = this.lockup(), size = lk.tsize, ty = lk.ty;
    x.save();
    x.textBaseline = "alphabetic";
    if (x.letterSpacing !== undefined) x.letterSpacing = "-0.01em";
    x.font = `italic 400 ${size}px "Bodoni Moda", serif`;
    x.globalAlpha = 1 - s.mix;
    x.fillStyle = "#F4F1EA";
    x.fillText(A.title, W * 0.032, ty);
    if (s.mix > 0){
      x.globalAlpha = s.mix;
      x.fillText(B.title, W * 0.032 - (1 - s.mix) * W * 0.10, ty - (1 - s.mix) * H * 0.06);
    }
    x.globalAlpha = 0.75;
    x.font = `500 ${lk.msize}px "JetBrains Mono", monospace`;
    if (x.letterSpacing !== undefined) x.letterSpacing = "0.22em";
    x.fillStyle = "#CFC9C0";
    x.fillText(`${(s.mix > 0.5 ? B : A).year} · ${(s.mix > 0.5 ? B : A).artist}`, W * 0.034, ty + lk.size * 0.24);
    x.restore();

    const cv = this.covers[s.a];
    const sm = document.createElement("canvas");
    sm.width = Math.round(W * 0.055); sm.height = Math.round(H * 0.62);
    const sx = sm.getContext("2d");
    sx.filter = "blur(5px)";
    sx.drawImage(cv, 220, 30, 18, 450, 0, 0, sm.width, sm.height);
    sx.filter = "none";
    sx.globalCompositeOperation = "destination-in";
    const mg = sx.createLinearGradient(0, 0, 0, sm.height);
    mg.addColorStop(0, "rgba(0,0,0,0)"); mg.addColorStop(0.42, "rgba(0,0,0,.95)");
    mg.addColorStop(0.62, "rgba(0,0,0,.7)"); mg.addColorStop(1, "rgba(0,0,0,0)");
    sx.fillStyle = mg; sx.fillRect(0, 0, sm.width, sm.height);
    const hg = sx.createLinearGradient(0, 0, sm.width, 0);
    hg.addColorStop(0, "rgba(0,0,0,0)"); hg.addColorStop(0.5, "rgba(0,0,0,1)"); hg.addColorStop(1, "rgba(0,0,0,0)");
    sx.fillStyle = hg; sx.fillRect(0, 0, sm.width, sm.height);
    x.save();
    x.globalAlpha = 0.26 + s.play * 0.12;
    x.translate(W * 0.855, H * 0.08);
    x.rotate(0.26);
    x.drawImage(sm, 0, 0);
    x.restore();
    this.upload(this.texF, this.cvF);
  }

  upload(tex, cv){
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  }

  render(){
    const gl = this.gl, s = this.st, u = this.u;
    const w = this.el.width, h = this.el.height, aspect = w / h;
    const bp = this.bodyXY();
    const mx = (bp.x - 0.5) * aspect, my = 0.5 - bp.y;
    const cx = (this.mouse.x - 0.5) * aspect, cy = 0.5 - this.mouse.y;
    const tr = TRACKS[s.a];
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.texB); gl.uniform1i(u.uBack, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.texF); gl.uniform1i(u.uFront, 1);
    gl.uniform2f(u.uRes, w, h);
    gl.uniform4f(u.uM0, mx, my, s.m0k, s.m0h);
    gl.uniform4f(u.uM1, mx + s.m1x, my + s.m1y, s.m1k, s.m1h);
    gl.uniform3f(u.uCur, cx, cy, s.curK);
    gl.uniform3f(u.uWave, Math.max(0, s.waveR), s.waveA, 0);
    gl.uniform1f(u.uSpin, s.spin);
    gl.uniform1f(u.uBlur, s.blur);
    gl.uniform1f(u.uTime, s.t);
    gl.uniform1f(u.uFade, Math.max(0, s.fade));
    gl.uniform1f(u.uGrain, 0.035 * (this.props.grao ?? 1));
    gl.uniform1f(u.uDisp, 0.014 + s.blur * 0.010);
    gl.uniform1f(u.uJet, s.jet);
    gl.uniform3f(u.uInk, tr.inkA[0], tr.inkA[1], tr.inkA[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  hud(){
    const s = this.st, tr = TRACKS[s.a];
    const names = { repouso: "Repouso", colapso: "Colapso", toca: "Em curso", pausa: "Decaimento", fusao: "Fusão de corpos" };
    if (this._st) this._st.textContent = names[s.mode] || s.mode;
    if (this._cat) this._cat.textContent = tr.cat;
    if (this._tc){
      const f = (n) => `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(Math.floor(n % 60)).padStart(2, "0")}`;
      this._tc.textContent = `${f(s.pos)} / ${f(tr.dur)}`;
    }
  }

  renderVals(){
    return {
      glRef: (n) => { if (n) this._gl = n; },
      catRef: (n) => { this._cat = n; },
      stateRef: (n) => { this._st = n; },
      tcRef: (n) => { this._tc = n; }
    };
  }
}
</script>
</body>
</html>
