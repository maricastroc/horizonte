<script type="text/x-dc" data-dc-script data-props="{&quot;intensidadeCampo&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Campo&quot;},&quot;grao&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Campo&quot;}}">
const ALBUMS = [
  { artist: "OROVA", title: "Densidade", year: "2026", cat: "A—001", bpm: 88, seed: 7,
    inkA: [0.96, 0.53, 0.25], inkB: [0.29, 0.55, 0.72],
    tracks: [["Peso Morto", 214], ["Densidade", 252], ["Colapso Suave", 188], ["Anel", 301], ["Fuga de Massa", 176]] },
  { artist: "MIRA SELVA", title: "Queda Livre", year: "2025", cat: "B—014", bpm: 104, seed: 31,
    inkA: [0.55, 0.78, 0.60], inkB: [0.86, 0.36, 0.42],
    tracks: [["Queda Livre", 197], ["Vento de Cauda", 233], ["Cinza Clara", 165], ["Órbita Baixa", 288]] },
  { artist: "TERRA NULA", title: "Marés Internas", year: "2024", cat: "C—028", bpm: 76, seed: 91,
    inkA: [0.92, 0.72, 0.30], inkB: [0.36, 0.40, 0.66],
    tracks: [["Maré de Sizígia", 268], ["Baixa-mar", 199], ["Sal", 154], ["Interior", 322], ["Corrente Fria", 205]] },
  { artist: "NÚCLEO 9", title: "Silêncio Sólido", year: "2026", cat: "D—037", bpm: 122, seed: 53,
    inkA: [0.88, 0.42, 0.62], inkB: [0.30, 0.62, 0.64],
    tracks: [["Bloco", 181], ["Silêncio Sólido", 244], ["Prensa", 167], ["Vazio Cheio", 276]] },
  { artist: "ALMA CRUA", title: "Ferro Doce", year: "2023", cat: "E—052", bpm: 68, seed: 17,
    inkA: [0.82, 0.50, 0.34], inkB: [0.52, 0.58, 0.44],
    tracks: [["Ferro Doce", 289], ["Rebite", 172], ["Solda Fria", 231], ["Bigorna", 198], ["Lima", 143]] }
];

const VERT = `attribute vec2 aP; void main(){ gl_Position = vec4(aP, 0.0, 1.0); }`;

const FRAG = `precision highp float;
uniform sampler2D uBack, uFront;
uniform vec2 uRes;
uniform vec4 uM0, uM1;
uniform vec3 uCur;
uniform vec3 uWave;
uniform float uSpin, uBlur, uTime, uFade, uGrain, uDisp, uJet;
uniform vec3 uInk;

float hash(vec2 p){ return fract(sin(dot(p, vec2(41.71, 289.13))) * 43758.5453); }

vec2 pullOf(vec2 p, vec4 m, float spin){
  vec2 d = p - m.xy;
  float r = max(length(d), 1e-4);
  float k = min(m.z / (r * r + 0.014), 0.85);
  vec2 dir = d / r;
  vec2 tang = vec2(-dir.y, dir.x);
  return -dir * k * 0.13 + tang * k * spin * 0.13;
}

float coreOf(vec2 p, vec4 m){
  if (m.w <= 0.0) return 0.0;
  float r = length(p - m.xy);
  return smoothstep(m.w, m.w * 0.87, r);
}

float rimOf(vec2 p, vec4 m){
  if (m.w <= 0.0) return 0.0;
  vec2 d = p - m.xy;
  float r = length(d);
  float band = exp(-pow((r - m.w * 1.01) / (m.w * 0.028), 2.0));
  float g = max(0.0, dot(normalize(d), normalize(vec2(-0.70, 0.71))));
  return band * pow(g, 3.5) * 1.25;
}

vec3 samp(sampler2D t, vec2 uv, vec2 off, float blur){
  vec3 c = vec3(0.0);
  for (int i = 0; i < 4; i++){
    float f = float(i) / 3.0;
    vec2 o = off * (1.0 + f * blur * 2.2);
    c.r += texture2D(t, uv + o * (1.0 + uDisp * 1.6)).r;
    c.g += texture2D(t, uv + o).g;
    c.b += texture2D(t, uv + o * (1.0 - uDisp * 1.6)).b;
  }
  return c / 4.0;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float aspect = uRes.x / uRes.y;
  vec2 p = (uv - 0.5) * vec2(aspect, 1.0);

  vec2 off = pullOf(p, uM0, uSpin) + pullOf(p, uM1, uSpin);
  off += pullOf(p, vec4(uCur.xy, uCur.z, 0.0), uSpin * 0.4);

  vec2 dw = p - uM0.xy;
  float rw = length(dw);
  float dr = rw - uWave.x;
  off += normalize(dw + 1e-5) * uWave.y * exp(-dr * dr * 42.0);

  vec2 offUv = off / vec2(aspect, 1.0);
  vec3 col = samp(uBack, uv, offUv, uBlur);

  float core = max(coreOf(p, uM0), coreOf(p, uM1));
  col = mix(col, vec3(0.0), core);
  col += uInk * (rimOf(p, uM0) + rimOf(p, uM1)) * 1.15;

  if (uJet > 0.001){
    vec2 jd = p - uM0.xy;
    float axis = abs(jd.x * 0.62 + jd.y * 0.78);
    float along = clamp(1.0 - abs(jd.x * 0.78 - jd.y * 0.62) * 0.7, 0.0, 1.0);
    col += uInk * exp(-axis * axis * 900.0) * along * uJet * 2.4;
  }

  vec2 fOff = offUv * 0.34;
  vec3 fCol = samp(uFront, uv, fOff, uBlur * 0.6);
  float fA = texture2D(uFront, uv + fOff).a;
  col = mix(col, fCol, clamp(fA * 1.6, 0.0, 1.0));

  float cd = length(p - uCur.xy);
  col += uInk * exp(-cd * cd * 5200.0) * 0.55;

  col *= uFade;
  col += (hash(gl_FragCoord.xy + fract(uTime) * 91.3) - 0.5) * uGrain;
  gl_FragColor = vec4(col, 1.0);
}`;

const EASE = (t) => 1 - Math.pow(1 - t, 3);
const rgb = (v, a) => `rgba(${Math.round(v[0] * 255)},${Math.round(v[1] * 255)},${Math.round(v[2] * 255)},${a})`;
const fmt = (n) => `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(Math.floor(Math.max(0, n) % 60)).padStart(2, "0")}`;

class Component extends DCLogic {
  componentDidMount(){
    this.el = this._gl;
    this.mouse = { x: 0.55, y: 0.45, tx: 0.55, ty: 0.45, v: 0, down: false, moved: 0, lx: 0 };
    this.st = {
      scale: "campo", zoom: 0, zoomT: 0,
      nav: 0, navT: 0, alb: 0, playAlb: -1,
      trk: 0, sel: 0, hover: -1,
      mode: "parado", play: 0, pos: 0, dur: 0,
      spin: 0.06, blur: 0, fade: 0, jet: 0, m0k: 0.088, m0h: 0.112,
      m1k: 0.02, m1h: 0.05, m1x: 0.6, m1y: 0.1,
      mix: 0, fuseB: 0, waveR: -1, waveA: 0, energy: 0.3,
      curK: 0, t: 0, seqT: 0, ringRot: 0, fadeSel: 0
    };
    this.parts = [];
    for (let i = 0; i < 240; i++) this.parts.push({
      a: Math.random() * 6.2832, r: 0.16 + Math.pow(Math.random(), 0.7) * 0.62,
      s: (0.12 + Math.random() * 0.5) * (Math.random() < 0.5 ? 1 : -1),
      z: Math.random(), tw: Math.random() * 6.28
    });
    this.covers = ALBUMS.map((a) => this.makeCover(a));
    this.rings = this.covers.map((c, i) => this.makeArcRing(c, 0.52 + (i % 3) * 0.06));
    this.setupGL();
    this.bind();
    if (document.fonts){ document.fonts.load('700 200px Archivo'); document.fonts.load('italic 400 120px "Bodoni Moda"'); document.fonts.load('500 14px "JetBrains Mono"'); }
    this.last = performance.now();
    this.loop = this.loop.bind(this);
    this.raf = requestAnimationFrame(this.loop);
  }

  componentWillUnmount(){
    cancelAnimationFrame(this.raf);
    ["resize"].forEach(e => window.removeEventListener(e, this.onResize));
    window.removeEventListener("keydown", this.onKey);
    window.removeEventListener("pointermove", this.onMove);
    window.removeEventListener("pointerdown", this.onDown);
    window.removeEventListener("pointerup", this.onUp);
    window.removeEventListener("wheel", this.onWheel);
  }

  bind(){
    this.onResize = () => this.resize();
    this.onMove = (e) => {
      this.intent = performance.now();
      const w = window.innerWidth, h = window.innerHeight;
      const nx = e.clientX / w, ny = e.clientY / h;
      this.mouse.v = Math.min(1, this.mouse.v + Math.hypot(nx - this.mouse.tx, ny - this.mouse.ty) * 9);
      if (this.mouse.down){
        const dx = e.clientX - this.mouse.lx;
        this.mouse.moved += Math.abs(dx);
        if (this.st.scale === "campo") this.st.navT -= dx / (w * 0.46);
      }
      this.mouse.lx = e.clientX;
      this.mouse.tx = nx; this.mouse.ty = ny;
    };
    this.onDown = (e) => { this.mouse.down = true; this.mouse.moved = 0; this.mouse.lx = e.clientX; };
    this.onUp = () => {
      this.mouse.down = false;
      if (this.mouse.moved < 7) this.click();
      else if (this.st.scale === "campo") this.st.navT = Math.round(this.st.navT);
    };
    this.onWheel = (e) => {
      e.preventDefault();
      const s = this.st;
      if (s.scale === "campo") s.navT += e.deltaY * 0.0016 + e.deltaX * 0.0016;
      else this.stepSel(e.deltaY > 0 ? 1 : -1);
    };
    this.onKey = (e) => {
      this.intent = performance.now();
      const s = this.st, k = e.key;
      if (e.code === "Space"){ e.preventDefault(); this.primary(); return; }
      if (k === "Escape"){ e.preventDefault(); this.back(); return; }
      if (k === "Enter"){ e.preventDefault(); this.primary(); return; }
      if (k === "ArrowRight" || k === "ArrowDown"){ e.preventDefault(); s.scale === "campo" ? s.navT += 1 : this.stepSel(1); }
      if (k === "ArrowLeft" || k === "ArrowUp"){ e.preventDefault(); s.scale === "campo" ? s.navT -= 1 : this.stepSel(-1); }
    };
    window.addEventListener("resize", this.onResize);
    window.addEventListener("pointermove", this.onMove, { passive: true });
    window.addEventListener("pointerdown", this.onDown);
    window.addEventListener("pointerup", this.onUp);
    window.addEventListener("wheel", this.onWheel, { passive: false });
    window.addEventListener("keydown", this.onKey);
  }

  setupGL(){
    const gl = this.el.getContext("webgl", { antialias: false, alpha: false, preserveDrawingBuffer: true });
    this.gl = gl;
    if (!gl) return;
    const mk = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
    const pr = gl.createProgram();
    gl.attachShader(pr, mk(gl.VERTEX_SHADER, VERT));
    gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(pr); gl.useProgram(pr);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, "aP");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    this.u = {};
    ["uBack","uFront","uRes","uM0","uM1","uCur","uWave","uSpin","uBlur","uTime","uFade","uGrain","uDisp","uJet","uInk"].forEach(n => this.u[n] = gl.getUniformLocation(pr, n));
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    this.texB = this.mkTex(); this.texF = this.mkTex();
    this.cvB = document.createElement("canvas"); this.ctxB = this.cvB.getContext("2d");
    this.cvF = document.createElement("canvas"); this.ctxF = this.cvF.getContext("2d");
    this.seg = document.createElement("canvas"); this.seg.width = 1000; this.seg.height = 1000;
    this.segX = this.seg.getContext("2d");
    this.resize();
  }

  mkTex(){
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return t;
  }

  resize(){
    if (!this.gl) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.3);
    const w = Math.max(2, Math.round(window.innerWidth * dpr)), h = Math.max(2, Math.round(window.innerHeight * dpr));
    this.el.width = w; this.el.height = h;
    this.gl.viewport(0, 0, w, h);
    const cw = Math.min(w, 1760), ch = Math.round(cw * h / w);
    this.cvB.width = cw; this.cvB.height = ch;
    this.cvF.width = cw; this.cvF.height = ch;
    this.W = cw; this.H = ch;
  }

  makeCover(a){
    const S = 512, c = document.createElement("canvas");
    c.width = S; c.height = S;
    const x = c.getContext("2d");
    const A = rgb(a.inkA, 1), B = rgb(a.inkB, 1);
    let s = a.seed;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    x.fillStyle = "#0A0910"; x.fillRect(0, 0, S, S);
    x.fillStyle = B;
    x.beginPath(); x.moveTo(0, S * (0.05 + rnd() * 0.2)); x.lineTo(S, 0); x.lineTo(S, S * 0.74); x.lineTo(0, S * 0.92); x.closePath(); x.fill();
    x.fillStyle = A;
    x.fillRect(S * (0.04 + rnd() * 0.12), S * 0.3, S * 0.52, S * 0.44);
    x.fillStyle = "#0A0910";
    x.beginPath(); x.arc(S * 0.72, S * (0.3 + rnd() * 0.2), S * 0.2, 0, 6.2832); x.fill();
    x.fillStyle = "#EDE7DC"; x.globalAlpha = 0.92;
    x.fillRect(0, S * (0.72 + rnd() * 0.14), S, S * 0.055);
    x.globalAlpha = 1;
    for (let i = 0; i < 6; i++){
      const y = rnd() * S, hh = S * (0.012 + rnd() * 0.05);
      x.globalAlpha = 0.35 + rnd() * 0.5;
      x.fillStyle = rnd() > 0.5 ? "#0A0910" : (rnd() > 0.5 ? A : B);
      x.fillRect(-S * 0.1, y, S * 1.2, hh);
    }
    x.globalAlpha = 1;
    for (let i = 0; i < 900; i++){
      x.globalAlpha = 0.015 + rnd() * 0.05;
      x.fillStyle = rnd() > 0.5 ? "#F2EFE8" : "#000";
      x.fillRect(rnd() * S, rnd() * S, 1.6, 1.6);
    }
    x.globalAlpha = 1;
    return c;
  }

  makeArcRing(cover, len){
    const RB = 1000, c = document.createElement("canvas");
    c.width = RB; c.height = RB;
    const x = c.getContext("2d");
    const C = RB / 2, Rin = C * 0.70, Rout = C * 0.95, th = Rout - Rin;
    const N = 280, S = 512, sw = S / N, arc = (2 * Math.PI * Rin) / N;
    x.translate(C, C);
    for (let i = 0; i < N; i++){
      const t = i / N;
      if (t > len) continue;
      x.save();
      x.rotate(t * 6.2832);
      x.globalAlpha = Math.min(1, (len - t) / 0.13) * Math.min(1, t / 0.10);
      x.drawImage(cover, i * sw, 0, sw + 1.5, S, Rin, -arc * 1.6, th, arc * 3.2);
      x.restore();
    }
    x.globalCompositeOperation = "destination-in";
    const g = x.createRadialGradient(0, 0, Rin * 0.94, 0, 0, Rout);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.28, "rgba(0,0,0,1)");
    g.addColorStop(0.8, "rgba(0,0,0,.9)"); g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.beginPath(); x.arc(0, 0, Rout, 0, 6.2832); x.fill();
    const o = document.createElement("canvas");
    o.width = RB; o.height = RB;
    const ox = o.getContext("2d");
    ox.filter = "blur(1.4px)";
    ox.drawImage(c, 0, 0);
    return o;
  }

  drawSegRing(albIdx, sel, hover, activeTrk, prog, ink){
    const x = this.segX, RB = 1000, C = RB / 2;
    const Rin = C * 0.70, Rout = C * 0.95, th = Rout - Rin;
    const cover = this.covers[albIdx], N = ALBUMS[albIdx].tracks.length;
    const S = 512, SL = 44, gap = 0.020;
    x.clearRect(0, 0, RB, RB);
    x.save();
    x.translate(C, C);
    for (let k = 0; k < N; k++){
      const t0 = k / N + gap / 2, t1 = (k + 1) / N - gap / 2;
      const isSel = k === sel, isHov = k === hover, isAct = k === activeTrk;
      const base = isAct ? 1 : (isSel ? 0.92 : (isHov ? 0.8 : 0.42));
      const inner = isSel || isAct ? Rin - th * 0.16 : Rin;
      const thick = isSel || isAct ? th * 1.16 : th * 0.82;
      const arcPx = (2 * Math.PI * inner) / (N * SL);
      for (let i = 0; i < SL; i++){
        const f = i / SL, t = t0 + (t1 - t0) * f;
        x.save();
        x.rotate(t * 6.2832);
        x.globalAlpha = base;
        x.drawImage(cover, Math.floor((k / N + (t1 - t0) * f) * S), 0, Math.ceil(S / (N * SL)) + 2, S, inner, -arcPx * 1.7, thick, arcPx * 3.4);
        x.restore();
      }
      x.save();
      x.globalAlpha = isAct ? 0.9 : (isSel ? 0.55 : 0.18);
      x.strokeStyle = ink;
      x.lineWidth = isAct ? 4 : 2;
      x.beginPath();
      x.arc(0, 0, inner - 10, t0 * 6.2832, (isAct ? t0 + (t1 - t0) * prog : t1) * 6.2832);
      x.stroke();
      x.restore();
    }
    x.restore();
    return this.seg;
  }

  ringR(){
    const s = this.st;
    return Math.min(this.W, this.H) * (0.42 - s.zoom * 0.115 + s.play * 0.055);
  }

  lockup(){
    const W = this.W, H = this.H, p = this.st.play, z = this.st.zoom;
    const size = W * (0.185 - p * 0.045 - z * 0.088);
    const ay = H * (0.555 + p * 0.03);
    return { size, ay, ty: ay + size * 0.50, tsize: size * 0.53, msize: W * 0.011 };
  }

  albPos(i){
    const s = this.st, d = i - s.nav;
    const depth = 1 / (1 + Math.abs(d) * 0.8);
    const zx = 0.615 + (0.60 - 0.615) * s.zoom;
    const zy = 0.425 + (0.44 - 0.425) * s.zoom;
    const x = zx + d * 0.285 * (1 - s.zoom * 0.6);
    const y = zy + Math.sin(d * 1.15) * 0.10 * (1 - s.zoom);
    return { x, y, depth, d };
  }

  stepSel(dir){
    const s = this.st;
    if (s.scale === "campo") return;
    const N = ALBUMS[s.alb].tracks.length;
    const next = (s.sel + dir + N) % N;
    s.sel = next;
    if (s.scale === "faixa" && (s.mode === "toca" || s.mode === "pausa")) this.fuseTo(s.alb, next);
  }

  primary(){
    const s = this.st;
    if (s.scale === "campo"){ this.enterAlbum(Math.round(s.nav)); return; }
    if (s.scale === "album"){ this.playTrack(s.alb, s.sel); return; }
    if (s.mode === "toca") s.mode = "pausa";
    else if (s.mode === "pausa") s.mode = "toca";
    else this.playTrack(s.alb, s.sel);
  }

  back(){
    const s = this.st;
    if (s.scale === "faixa"){ s.scale = "album"; s.zoomT = 1; s.play = s.play; return; }
    if (s.scale === "album"){ s.scale = "campo"; s.zoomT = 0; s.hover = -1; return; }
  }

  enterAlbum(i){
    const s = this.st;
    s.alb = Math.max(0, Math.min(ALBUMS.length - 1, i));
    s.navT = s.alb; s.scale = "album"; s.zoomT = 1;
    s.sel = (s.playAlb === s.alb) ? s.trk : 0;
    s.fadeSel = 0;
  }

  playTrack(alb, trk){
    const s = this.st;
    if (s.scale !== "faixa" || s.playAlb !== alb || s.trk !== trk){
      if (s.playAlb >= 0 && (s.mode === "toca" || s.mode === "pausa") && s.scale === "faixa"){ this.fuseTo(alb, trk); return; }
      s.playAlb = alb; s.trk = trk; s.sel = trk;
      s.dur = ALBUMS[alb].tracks[trk][1];
      s.pos = 0; s.scale = "faixa"; s.zoomT = 1;
      s.mode = "colapso"; s.seqT = 0;
    }
  }

  fuseTo(alb, trk){
    const s = this.st;
    if (s.mode === "fusao") return;
    s.prevMode = s.mode === "pausa" ? "toca" : "toca";
    s.fuseB = trk; s.fuseAlb = alb;
    s.mode = "fusao"; s.seqT = 0; s.mix = 0;
    s.m1x = Math.cos(-0.7) * 1.5; s.m1y = Math.sin(-0.7) * 1.5;
    s.m1k = 0.03; s.m1h = 0.055;
  }

  hitTest(){
    const s = this.st, W = this.W, H = this.H;
    const mx = this.mouse.x * W, my = this.mouse.y * H;
    if (s.scale === "campo"){
      let best = -1, bd = 1e9;
      for (let i = 0; i < ALBUMS.length; i++){
        const p = this.albPos(i);
        const r = Math.min(W, H) * 0.12 * p.depth + 26;
        const dd = Math.hypot(mx - p.x * W, my - p.y * H);
        if (dd < r && dd < bd){ bd = dd; best = i; }
      }
      return { kind: best >= 0 ? "corpo" : "vazio", i: best };
    }
    const p = this.albPos(s.alb);
    const bx = p.x * W, by = p.y * H;
    const R = this.ringR();
    const dx = mx - bx, dy = (my - by) / 0.62;
    const rr = Math.hypot(dx, dy);
    if (rr < R * 0.55) return { kind: "corpo", i: s.alb };
    if (rr > R * 0.62 && rr < R * 1.34){
      let a = Math.atan2(dy, dx) - s.ringRot;
      a = ((a % 6.2832) + 6.2832) % 6.2832;
      const N = ALBUMS[s.alb].tracks.length;
      return { kind: "faixa", i: Math.floor((a / 6.2832) * N) % N };
    }
    return { kind: "vazio", i: -1 };
  }

  click(){
    const s = this.st, h = this.hitTest();
    if (s.scale === "campo"){
      if (h.kind === "corpo") this.enterAlbum(h.i);
      return;
    }
    if (h.kind === "faixa"){ this.playTrack(s.alb, h.i); return; }
    if (h.kind === "corpo"){
      if (s.scale === "faixa"){ s.mode = s.mode === "toca" ? "pausa" : "toca"; }
      else this.playTrack(s.alb, s.sel);
      return;
    }
    this.back();
  }

  loop(now){
    this.raf = requestAnimationFrame(this.loop);
    if (!this.gl) return;
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    this.step(dt);
    this.drawBack();
    this.drawFront();
    this.render();
    this.hud();
  }

  step(dt){
    const s = this.st;
    s.t += dt; s.seqT += dt;
    const K = this.props.intensidadeCampo ?? 1;
    const m = this.mouse;
    m.x += (m.tx - m.x) * Math.min(1, dt * 5.2);
    m.y += (m.ty - m.y) * Math.min(1, dt * 5.2);
    m.v *= Math.pow(0.05, dt);
    s.curK = (0.006 + m.v * 0.020) * K;

    s.navT = Math.max(0, Math.min(ALBUMS.length - 1, s.navT));
    s.nav += (s.navT - s.nav) * Math.min(1, dt * 5.5);
    s.zoom += (s.zoomT - s.zoom) * Math.min(1, dt * 4.2);
    if (s.scale === "campo") s.alb = Math.round(s.nav);

    const alb = ALBUMS[s.scale === "campo" ? Math.round(s.nav) : s.alb];
    const beat = (s.t * alb.bpm) / 60;
    const bass = Math.exp(-6.5 * (beat - Math.floor(beat)));
    const mid = 0.5 + 0.5 * Math.sin(s.t * 1.7) * Math.sin(s.t * 0.63);
    const treb = Math.pow(Math.abs(Math.sin(s.t * 9.1) * Math.sin(s.t * 3.3)), 3);
    const live = s.mode === "toca" || s.mode === "fusao";
    s.energy += ((live ? 0.55 + bass * 0.45 : (s.mode === "pausa" ? 0.22 : 0.3)) - s.energy) * Math.min(1, dt * 4);
    s.bass = bass; s.mid = mid; s.treb = treb;

    const h = this.hitTest();
    s.hover = h.kind === "faixa" ? h.i : (this.railTrk >= 0 ? this.railTrk : -1);
    s.hoverBody = h.kind === "corpo" ? h.i : (this.railAlb >= 0 ? this.railAlb : -1);
    if (s.scale === "album" && s.hover >= 0) s.sel = s.hover;

    let tgt = { m0k: 0.088 * K, m0h: 0.112, spin: 0.06, blur: 0, fade: 1, jet: 0, play: 0 };
    if (s.scale === "album") { tgt.m0k = 0.10 * K; tgt.m0h = 0.096; tgt.spin = 0.16; }

    if (s.mode === "colapso"){
      const p = s.seqT;
      if (p < 1.1){
        const e = p / 1.1;
        tgt.m0k = 0.055 + e * e * 0.30; tgt.m0h = 0.112 + e * 0.03;
        tgt.spin = 0.06 + e * 2.3; tgt.blur = e * 1.5; tgt.fade = 1 - Math.pow(e, 2.6);
      } else if (p < 1.3){
        tgt.m0k = 0.36; tgt.m0h = 0.10; tgt.spin = 2.4; tgt.blur = 1.5; tgt.fade = 0.03;
      } else if (p < 2.25){
        const e = (p - 1.3) / 0.95;
        tgt.m0k = 0.36 - e * 0.28; tgt.m0h = 0.10 - e * 0.02;
        tgt.spin = 2.4 - e * 2.1; tgt.blur = 1.5 * (1 - e);
        tgt.fade = Math.min(1, e * 1.9); tgt.jet = Math.sin(Math.min(1, e * 1.5) * Math.PI) * 1.1;
        tgt.play = e;
      } else { s.mode = "toca"; }
    }

    if (s.mode === "toca" || s.mode === "pausa"){
      tgt.play = s.mode === "toca" ? 1 : 0.86;
      tgt.m0k = (0.075 + bass * 0.030 * (s.mode === "toca" ? 1 : 0.25)) * K;
      tgt.m0h = 0.082;
      tgt.spin = s.mode === "toca" ? 0.42 + mid * 0.14 : 0.06;
      tgt.jet = s.mode === "toca" ? 0.10 + bass * 0.22 : 0.02;
      tgt.blur = s.mode === "toca" ? bass * 0.12 : 0;
      if (s.mode === "toca"){
        s.pos += dt;
        if (s.pos >= s.dur){
          const N = ALBUMS[s.playAlb].tracks.length;
          this.fuseTo(s.playAlb, (s.trk + 1) % N);
        }
      }
      if (s.scale === "album") tgt.play *= 0.25;
    }

    if (s.mode === "fusao"){
      const p = s.seqT;
      tgt.play = 1;
      if (p < 0.9){
        const e = p / 0.9, ee = e * e;
        const ang = -0.7 + ee * 5.4, rad = 1.5 * (1 - ee) + 0.02;
        s.m1x = Math.cos(ang) * rad; s.m1y = Math.sin(ang) * rad;
        s.m1k = 0.03 + ee * 0.05; s.m1h = 0.055 + ee * 0.02;
        s.mix = e * 0.5;
        tgt.m0k = 0.075 + ee * 0.05; tgt.spin = 0.42 + ee * 0.9; tgt.blur = ee * 0.4; tgt.jet = 0.1;
      } else if (p < 1.6){
        const e = (p - 0.9) / 0.7;
        if (s.waveR < 0) s.waveR = 0.02;
        s.m1k *= 0.72; s.m1h *= 0.80;
        s.mix = 0.5 + e * 0.5;
        tgt.m0k = 0.075 + (1 - e) * 0.08; tgt.spin = 0.42 + (1 - e) * 0.8;
        tgt.blur = (1 - e) * 0.25; tgt.jet = 0.1;
      } else {
        s.playAlb = s.fuseAlb; s.trk = s.fuseB; s.sel = s.fuseB;
        s.alb = s.fuseAlb; s.dur = ALBUMS[s.alb].tracks[s.trk][1]; s.pos = 0;
        s.mix = 0; s.m1k = 0; s.m1h = 0; s.waveR = -1; s.mode = "toca";
        if (s.scale !== "album") { s.scale = "faixa"; s.zoomT = 1; }
      }
    }

    if (s.waveR >= 0){
      s.waveR += dt * 2.1;
      s.waveA = 0.075 * Math.max(0, 1 - s.waveR / 2.3);
      if (s.waveR > 2.4) s.waveR = -1;
    } else s.waveA = 0;

    s.ringRot += dt * (0.05 + s.energy * 0.14) * (s.mode === "toca" ? 1.6 : 1);
    s.fadeSel += ((s.scale === "campo" ? 0 : 1) - s.fadeSel) * Math.min(1, dt * 4);

    const k = Math.min(1, dt * 9);
    s.m0k += (tgt.m0k - s.m0k) * k;
    s.m0h += (tgt.m0h - s.m0h) * k;
    s.spin += (tgt.spin - s.spin) * k;
    s.blur += (tgt.blur - s.blur) * k;
    s.fade += (tgt.fade - s.fade) * Math.min(1, dt * 14);
    s.jet += (tgt.jet - s.jet) * k;
    s.play += (tgt.play - s.play) * Math.min(1, dt * 3.4);

    const pull = s.mode === "colapso" && s.seqT < 1.3;
    for (const q of this.parts){
      q.a += dt * q.s * (0.25 + s.energy * 0.9) * (s.mode === "toca" ? 1.5 : 1);
      if (pull) q.r *= 1 - dt * 1.5;
      else q.r += ((0.16 + q.z * 0.62) - q.r) * dt * 1.2;
      if (s.mode === "pausa") q.r -= dt * 0.012;
    }
  }

  drawBack(){
    const x = this.ctxB, W = this.W, H = this.H, s = this.st;
    const A = ALBUMS[s.alb];
    const inkA = (a) => rgb(A.inkA, a), inkB = (a) => rgb(A.inkB, a);
    const p0 = this.albPos(s.alb), bx = p0.x * W, by = p0.y * H;

    x.fillStyle = "#07070A"; x.fillRect(0, 0, W, H);
    const g = x.createRadialGradient(bx - W * 0.06, by, 0, bx, by, W * 0.62);
    g.addColorStop(0, inkA(0.15 + s.energy * 0.07));
    g.addColorStop(0.45, inkB(0.06));
    g.addColorStop(1, "rgba(7,7,10,0)");
    x.fillStyle = g; x.fillRect(0, 0, W, H);

    const M = Math.min(W, H);
    for (let i = 0; i < ALBUMS.length; i++){
      if (i === s.alb) continue;
      const p = this.albPos(i);
      const a = Math.max(0, (0.62 * p.depth) * (1 - s.zoom));
      if (a < 0.02) continue;
      const R = M * (0.16 + 0.24 * p.depth);
      this.ring(x, i, p.x * W, p.y * H, R, s.t * 0.04 + i, a);
      x.save();
      x.globalAlpha = a * 0.9;
      x.fillStyle = "#0B0A0E";
      const br = M * 0.062 * p.depth;
      x.beginPath(); x.ellipse(p.x * W, p.y * H, br, br, 0, 0, 6.2832); x.fill();
      x.globalAlpha = a * 0.9;
      x.strokeStyle = rgb(ALBUMS[i].inkA, 0.9); x.lineWidth = 1.6;
      x.beginPath(); x.arc(p.x * W, p.y * H, br, 2.0, 4.1); x.stroke();
      x.textAlign = "center";
      if (x.letterSpacing !== undefined) x.letterSpacing = "-0.03em";
      x.globalAlpha = a * (i === s.hoverBody ? 1 : 0.66);
      x.fillStyle = "#E8E4DC";
      x.font = `700 ${M * 0.062 * p.depth}px Archivo, sans-serif`;
      x.fillText(ALBUMS[i].artist, p.x * W, p.y * H + br + M * 0.075 * p.depth);
      if (x.letterSpacing !== undefined) x.letterSpacing = "0.2em";
      x.globalAlpha = a * (i === s.hoverBody ? 0.95 : 0.5);
      x.font = `500 ${W * 0.0092}px "JetBrains Mono", monospace`;
      x.fillText(`${ALBUMS[i].cat} · ${ALBUMS[i].tracks.length} FAIXAS`, p.x * W, p.y * H + br + M * 0.105 * p.depth);
      x.textAlign = "left";
      x.restore();
    }

    const R = this.ringR();
    if (s.fadeSel < 0.98) this.ring(x, s.alb, bx, by, R, s.ringRot, (1 - s.fadeSel) * (1 - s.mix * 0.7) * 0.85);
    if (s.fadeSel > 0.02){
      const activeTrk = (s.playAlb === s.alb && (s.mode === "toca" || s.mode === "pausa" || s.mode === "fusao")) ? s.trk : -1;
      const prog = s.dur ? Math.min(1, s.pos / s.dur) : 0;
      const buf = this.drawSegRing(s.alb, s.sel, s.hover, activeTrk, prog, inkA(1));
      x.save();
      x.globalCompositeOperation = "lighter";
      x.globalAlpha = s.fadeSel * (1 - s.mix * 0.6);
      x.translate(bx, by); x.scale(1, 0.62); x.rotate(s.ringRot);
      const sc = R / 0.475;
      x.drawImage(buf, -sc / 2, -sc / 2, sc, sc);
      x.restore();
      if (s.mix > 0){
        x.save();
        x.globalCompositeOperation = "lighter";
        x.globalAlpha = s.mix * 0.8;
        x.translate(bx, by); x.scale(1, 0.62); x.rotate(-s.ringRot * 0.7 + 1.1);
        const sc2 = (R * (1.18 - s.mix * 0.18)) / 0.475;
        x.drawImage(this.rings[s.alb], -sc2 / 2, -sc2 / 2, sc2, sc2);
        x.restore();
      }
      this.trackLabels(x, bx, by, R, A, s);
    }

    x.save();
    x.globalCompositeOperation = "lighter";
    for (const q of this.parts){
      const rr = q.r * M * 0.9;
      const px = bx + Math.cos(q.a) * rr * 1.25, py = by + Math.sin(q.a) * rr * 0.72;
      const tw = s.mode === "toca" ? 0.62 + 0.38 * Math.sin(q.tw + s.t * 5 + s.treb * 5) : 0.6;
      x.globalAlpha = (0.02 + q.z * 0.13) * tw * (0.5 + s.energy * 0.7);
      x.fillStyle = q.z > 0.6 ? inkA(1) : "#CFCAC2";
      x.fillRect(px, py, 1.1, 1.1);
    }
    x.restore();

    const lk = this.lockup();
    x.save();
    x.textBaseline = "alphabetic";
    if (x.letterSpacing !== undefined) x.letterSpacing = "-0.035em";
    let asz = lk.size;
    x.font = `700 ${asz}px Archivo, sans-serif`;
    const maxW = W * (s.scale === "campo" ? 0.90 : 0.52) - W * 0.028;
    const mw = x.measureText(A.artist).width;
    if (mw > maxW){ asz = Math.max(asz * 0.55, asz * (maxW / mw)); x.font = `700 ${asz}px Archivo, sans-serif`; }
    x.globalAlpha = (1 - s.mix) * (0.92 - s.play * 0.25);
    x.fillStyle = "#EFEBE3";
    x.fillText(A.artist, W * 0.028, lk.ay);
    if (s.mix > 0){
      x.globalAlpha = s.mix * (0.92 - s.play * 0.25);
      x.fillText(ALBUMS[s.fuseAlb].artist, W * 0.028 + (1 - s.mix) * W * 0.12, lk.ay + (1 - s.mix) * H * 0.05);
    }
    x.restore();

    if (s.play > 0.02){
      const bandH = H * 0.115 * s.play;
      x.save();
      x.globalAlpha = 0.34 * s.play;
      x.drawImage(this.covers[s.alb], 0, H - bandH, W, bandH);
      x.globalCompositeOperation = "destination-out";
      const fg = x.createLinearGradient(0, H - bandH, 0, H);
      fg.addColorStop(0, "rgba(0,0,0,1)"); fg.addColorStop(0.6, "rgba(0,0,0,0.15)"); fg.addColorStop(1, "rgba(0,0,0,0.55)");
      x.fillStyle = fg; x.fillRect(0, H - bandH, W, bandH);
      x.restore();
      const prog = s.dur ? Math.min(1, s.pos / s.dur) : 0;
      x.fillStyle = inkA(0.85 * s.play);
      x.fillRect(0, H - 2, W * prog, 2);
    }

    const scrim = x.createLinearGradient(0, H * 0.885, 0, H);
    scrim.addColorStop(0, "rgba(7,7,10,0)"); scrim.addColorStop(0.55, "rgba(7,7,10,.62)"); scrim.addColorStop(1, "rgba(7,7,10,.88)");
    x.fillStyle = scrim; x.fillRect(0, H * 0.885, W, H * 0.115);
    const scrimT = x.createLinearGradient(0, 0, 0, H * 0.10);
    scrimT.addColorStop(0, "rgba(7,7,10,.72)"); scrimT.addColorStop(1, "rgba(7,7,10,0)");
    x.fillStyle = scrimT; x.fillRect(0, 0, W, H * 0.10);

    this.upload(this.texB, this.cvB);
  }

  trackLabels(x, bx, by, R, A, s){
    const N = A.tracks.length;
    x.save();
    x.textBaseline = "middle";
    if (x.letterSpacing !== undefined) x.letterSpacing = "0.2em";
    x.font = `500 ${this.W * 0.0105}px "JetBrains Mono", monospace`;
    for (let k = 0; k < N; k++){
      const t = (k + 0.5) / N;
      const a = t * 6.2832 + s.ringRot;
      const px = Math.max(this.W * 0.055, Math.min(this.W * 0.62, bx + Math.cos(a) * R * 1.24));
      const py = by + Math.sin(a) * R * 1.24 * 0.62;
      const on = k === s.sel || (s.playAlb === s.alb && k === s.trk);
      const hidden = (Math.cos(a) > 0.30) || (py > this.H * 0.60 && px < this.W * 0.46);
      if (hidden && !on) continue;
      x.globalAlpha = s.fadeSel * (on ? 0.95 : 0.42);
      x.fillStyle = on ? rgb(A.inkA, 1) : "#CFCAC2";
      x.textAlign = Math.cos(a) < 0 ? "right" : "left";
      const label = `${String(k + 1).padStart(2, "0")}  ${A.tracks[k][0].toUpperCase()}`;
      x.fillText(label, px, py);
      x.globalAlpha = s.fadeSel * (on ? 0.6 : 0.18);
      x.strokeStyle = on ? rgb(A.inkA, 1) : "#CFCAC2";
      x.lineWidth = 1;
      x.beginPath();
      x.moveTo(bx + Math.cos(a) * R * 1.08, by + Math.sin(a) * R * 1.08 * 0.62);
      x.lineTo(bx + Math.cos(a) * R * 1.20, by + Math.sin(a) * R * 1.20 * 0.62);
      x.stroke();
    }
    x.restore();
  }

  ring(x, idx, cx, cy, R, rot, alpha){
    if (alpha <= 0.01) return;
    const buf = this.rings[idx], sc = R / 0.475;
    x.save();
    x.globalCompositeOperation = "lighter";
    x.globalAlpha = alpha;
    x.translate(cx, cy);
    x.scale(1, 0.62);
    x.rotate(rot);
    x.drawImage(buf, -sc / 2, -sc / 2, sc, sc);
    x.restore();
  }

  drawFront(){
    const x = this.ctxF, W = this.W, H = this.H, s = this.st;
    const A = ALBUMS[s.alb];
    x.clearRect(0, 0, W, H);
    const lk = this.lockup();
    const nowTitle = s.scale === "campo" ? A.title : A.tracks[s.mix > 0.5 ? s.fuseB : (s.scale === "faixa" && s.mode !== "colapso" ? s.trk : s.sel)][0];
    x.save();
    x.textBaseline = "alphabetic";
    if (x.letterSpacing !== undefined) x.letterSpacing = "-0.01em";
    x.font = `italic 400 ${lk.tsize}px "Bodoni Moda", serif`;
    x.globalAlpha = 1;
    x.fillStyle = "#F4F1EA";
    x.fillText(nowTitle, W * 0.032, lk.ty);
    x.globalAlpha = 0.75;
    x.font = `500 ${lk.msize}px "JetBrains Mono", monospace`;
    if (x.letterSpacing !== undefined) x.letterSpacing = "0.22em";
    x.fillStyle = "#CFC9C0";
    const sub = s.scale === "campo"
      ? `${A.year} · ${A.tracks.length} FAIXAS · ${A.cat}`
      : `${A.artist} · ${A.title} · ${A.year}`;
    x.fillText(sub, W * 0.034, lk.ty + lk.size * 0.24);
    x.restore();

    const cv = this.covers[s.alb];
    const sm = document.createElement("canvas");
    sm.width = Math.round(W * 0.055); sm.height = Math.round(H * 0.62);
    const sx = sm.getContext("2d");
    sx.filter = "blur(5px)";
    sx.drawImage(cv, 220, 30, 18, 450, 0, 0, sm.width, sm.height);
    sx.filter = "none";
    sx.globalCompositeOperation = "destination-in";
    const mg = sx.createLinearGradient(0, 0, 0, sm.height);
    mg.addColorStop(0, "rgba(0,0,0,0)"); mg.addColorStop(0.42, "rgba(0,0,0,.95)");
    mg.addColorStop(0.62, "rgba(0,0,0,.7)"); mg.addColorStop(1, "rgba(0,0,0,0)");
    sx.fillStyle = mg; sx.fillRect(0, 0, sm.width, sm.height);
    const hg = sx.createLinearGradient(0, 0, sm.width, 0);
    hg.addColorStop(0, "rgba(0,0,0,0)"); hg.addColorStop(0.5, "rgba(0,0,0,1)"); hg.addColorStop(1, "rgba(0,0,0,0)");
    sx.fillStyle = hg; sx.fillRect(0, 0, sm.width, sm.height);
    x.save();
    x.globalAlpha = 0.26 + s.play * 0.12;
    x.translate(W * 0.855, H * 0.08);
    x.rotate(0.26);
    x.drawImage(sm, 0, 0);
    x.restore();

    this.upload(this.texF, this.cvF);
  }

  upload(tex, cv){
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  }

  render(){
    const gl = this.gl, s = this.st, u = this.u;
    const w = this.el.width, h = this.el.height, aspect = w / h;
    const p0 = this.albPos(s.alb);
    const mx = (p0.x - 0.5) * aspect, my = 0.5 - p0.y;
    const cx = (this.mouse.x - 0.5) * aspect, cy = 0.5 - this.mouse.y;
    const A = ALBUMS[s.alb];
    let m1x = mx + s.m1x, m1y = my + s.m1y, m1k = s.m1k, m1h = s.m1h;
    if (s.scale === "campo" && s.mode !== "fusao"){
      const nb = this.albPos(Math.round(s.nav) + (s.nav - Math.round(s.nav) >= 0 ? 1 : -1));
      m1x = (nb.x - 0.5) * aspect; m1y = 0.5 - nb.y; m1k = 0.030; m1h = 0.052;
    }
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.texB); gl.uniform1i(u.uBack, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.texF); gl.uniform1i(u.uFront, 1);
    gl.uniform2f(u.uRes, w, h);
    gl.uniform4f(u.uM0, mx, my, s.m0k, s.m0h);
    gl.uniform4f(u.uM1, m1x, m1y, m1k, m1h);
    gl.uniform3f(u.uCur, cx, cy, s.curK);
    gl.uniform3f(u.uWave, Math.max(0, s.waveR), s.waveA, 0);
    gl.uniform1f(u.uSpin, s.spin);
    gl.uniform1f(u.uBlur, s.blur);
    gl.uniform1f(u.uTime, s.t);
    gl.uniform1f(u.uFade, Math.max(0, s.fade));
    gl.uniform1f(u.uGrain, 0.035 * (this.props.grao ?? 1));
    gl.uniform1f(u.uDisp, 0.014 + s.blur * 0.010);
    gl.uniform1f(u.uJet, s.jet);
    gl.uniform3f(u.uInk, A.inkA[0], A.inkA[1], A.inkA[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  hud(){
    const s = this.st;
    const alb = ALBUMS[s.playAlb >= 0 ? s.playAlb : s.alb];
    const lit = "#E8E4DC", dim = "#4E4A45";
    if (this._s1) this._s1.style.color = s.scale === "campo" ? lit : dim;
    if (this._s2) this._s2.style.color = s.scale === "album" ? lit : dim;
    if (this._s3) this._s3.style.color = s.scale === "faixa" ? lit : dim;

    const playing = s.mode === "toca" || s.mode === "fusao";
    if (this._dot){
      this._dot.style.background = s.playAlb < 0 ? "#4E4A45" : rgb(alb.inkA, playing ? 0.6 + 0.4 * Math.abs(Math.sin(s.t * 2.4)) : 0.35);
    }
    if (this._now){
      this._now.textContent = s.playAlb < 0 ? "Nada em curso"
        : `${String(s.trk + 1).padStart(2, "0")} · ${alb.tracks[s.trk][0]}`;
    }
    if (this._who){
      this._who.textContent = s.playAlb < 0
        ? `Coleção · ${ALBUMS.length} corpos`
        : `${alb.artist}${s.mode === "pausa" ? " · pausado" : ""}`;
    }
    if (this._bar) this._bar.style.width = `${s.dur ? Math.min(100, (s.pos / s.dur) * 100) : 0}%`;
    if (this._tc) this._tc.textContent = `${fmt(s.pos)} / ${fmt(s.dur || 0)}`;
    if (this._cat){
      this._cat.textContent = s.scale === "campo"
        ? `Coleção · ${Math.round(s.nav) + 1}/${ALBUMS.length}`
        : `${ALBUMS[s.alb].cat} · ${ALBUMS[s.alb].tracks.length} faixas`;
    }
    this.wire();
    this.instruments();
  }

  wire(){
    if (this._wired || !this._albRail || !this._trkRail || !this._scale) return;
    this._wired = true;
    const stop = (e) => { e.stopPropagation(); this.intent = performance.now(); };
    const rowOf = (e) => e.target.closest("[data-i]");

    this._albRows = Array.from(this._albRail.querySelectorAll("[data-i]"));
    this._trkRows = Array.from(this._trkRail.querySelectorAll("[data-i]"));

    this._albRail.addEventListener("pointerdown", stop);
    this._albRail.addEventListener("pointerup", (e) => { stop(e); const r = rowOf(e); if (r) this.enterAlbum(+r.dataset.i); });
    this._albRail.addEventListener("pointermove", (e) => { const r = rowOf(e); this.railAlb = r ? +r.dataset.i : -1; });
    this._albRail.addEventListener("pointerleave", () => { this.railAlb = -1; });

    this._trkRail.addEventListener("pointerdown", stop);
    this._trkRail.addEventListener("pointerup", (e) => { stop(e); const r = rowOf(e); if (r) this.playTrack(this.st.alb, +r.dataset.i); });
    this._trkRail.addEventListener("pointermove", (e) => { const r = rowOf(e); this.railTrk = r ? +r.dataset.i : -1; });
    this._trkRail.addEventListener("pointerleave", () => { this.railTrk = -1; });

    this._scale.addEventListener("pointerdown", stop);
    this._scale.addEventListener("pointerup", (e) => {
      stop(e);
      const t = e.target.closest("[data-lvl]"); if (!t) return;
      const s = this.st, lvl = t.dataset.lvl;
      if (lvl === "campo"){ s.scale = "campo"; s.zoomT = 0; s.hover = -1; }
      else if (lvl === "album"){ if (s.scale === "campo") this.enterAlbum(Math.round(s.nav)); else { s.scale = "album"; s.zoomT = 1; } }
      else if (lvl === "faixa"){ if (s.playAlb >= 0){ s.alb = s.playAlb; s.scale = "faixa"; s.zoomT = 1; } else this.playTrack(s.alb, s.sel); }
    });

    const btn = (el, fn) => { if (!el) return; el.addEventListener("pointerdown", stop); el.addEventListener("pointerup", (e) => { stop(e); fn(); }); };
    btn(this._prev, () => this.skip(-1));
    btn(this._next, () => this.skip(1));
    btn(this._play, () => this.transport());
    btn(this._back, () => this.back());
    if (this._seek){
      this._seek.addEventListener("pointerdown", stop);
      this._seek.addEventListener("pointerup", (e) => {
        stop(e);
        const s = this.st; if (!s.dur) return;
        const r = this._seek.getBoundingClientRect();
        s.pos = Math.max(0, Math.min(s.dur - 1, ((e.clientX - r.left) / r.width) * s.dur));
      });
    }
  }

  transport(){
    const s = this.st;
    if (s.playAlb < 0 || s.scale !== "faixa"){ this.playTrack(s.alb, s.sel); return; }
    s.mode = s.mode === "toca" ? "pausa" : "toca";
  }

  skip(dir){
    const s = this.st;
    const N = ALBUMS[s.alb].tracks.length;
    const next = ((s.playAlb === s.alb && s.scale === "faixa" ? s.trk : s.sel) + dir + N) % N;
    if (s.playAlb === s.alb && (s.mode === "toca" || s.mode === "pausa" || s.mode === "colapso")) this.fuseTo(s.alb, next);
    else { s.sel = next; if (s.scale === "faixa") this.playTrack(s.alb, next); }
  }

  instruments(){
    const s = this.st, now = performance.now();
    const idle = now - (this.intent || 0) > 2600;
    if (this._layer) this._layer.style.opacity = idle ? "0.32" : "1";
    if (this._trkRail){
      const on = s.scale !== "campo";
      this._trkRail.style.opacity = on ? "1" : "0";
      this._trkRail.style.pointerEvents = on ? "auto" : "none";
    }
    if (this._back) this._back.style.opacity = s.scale === "campo" ? "0" : "1";

    const lit = "#E8E4DC", dim = "#5A554F";
    if (this._scale){
      const lv = { campo: 0, album: 1, faixa: 2 }[s.scale];
      Array.from(this._scale.querySelectorAll("[data-lvl]")).forEach((el, i) => {
        el.style.color = i === lv ? lit : (i < lv ? "#8C867E" : dim);
      });
    }

    const curAlb = s.scale === "campo" ? Math.round(s.nav) : s.alb;
    if (this._albRows) this._albRows.forEach((r, i) => {
      const isCur = i === curAlb, isHov = i === this.railAlb;
      r.style.color = isCur ? lit : (isHov ? "#C9C4BB" : "#8C867E");
      const mk = r.querySelector('[data-role="mk"]');
      if (mk) mk.style.background = isCur ? rgb(ALBUMS[i].inkA, 1) : (i === s.playAlb ? rgb(ALBUMS[i].inkA, 0.5) : "#3A3631");
    });

    const A = ALBUMS[s.alb];
    if (this._trkRows) this._trkRows.forEach((r, i) => {
      const t = A.tracks[i];
      r.style.display = t ? "grid" : "none";
      if (!t) return;
      const isSel = i === s.sel, isPlay = s.playAlb === s.alb && i === s.trk;
      r.querySelector('[data-role="n"]').textContent = String(i + 1).padStart(2, "0");
      r.querySelector('[data-role="t"]').textContent = t[0];
      r.querySelector('[data-role="d"]').textContent = fmt(t[1]);
      r.style.color = isPlay ? rgb(A.inkA, 1) : (isSel ? lit : "#8C867E");
      const mk = r.querySelector('[data-role="mk"]');
      mk.style.background = isPlay ? rgb(A.inkA, 1) : (isSel ? "#E8E4DC" : "#3A3631");
      mk.style.width = isSel || isPlay ? "7px" : "5px";
      mk.style.height = isSel || isPlay ? "7px" : "5px";
    });

    if (this._play) this._play.textContent = s.mode === "toca" ? "❙❙ Pausar" : (s.playAlb >= 0 && s.scale === "faixa" ? "▸ Retomar" : "▸ Tocar");
  }

  renderVals(){
    return {
      glRef: (n) => { if (n) this._gl = n; },
      layerRef: (n) => { this._layer = n; },
      scaleRef: (n) => { this._scale = n; },
      albRailRef: (n) => { this._albRail = n; },
      trkRailRef: (n) => { this._trkRail = n; },
      dotRef: (n) => { this._dot = n; }, nowRef: (n) => { this._now = n; }, whoRef: (n) => { this._who = n; },
      barRef: (n) => { this._bar = n; }, tcRef: (n) => { this._tc = n; }, catRef: (n) => { this._cat = n; },
      seekRef: (n) => { this._seek = n; }, prevRef: (n) => { this._prev = n; },
      playRef: (n) => { this._play = n; }, nextRef: (n) => { this._next = n; }, backRef: (n) => { this._back = n; }
    };
  }
}
</script>
</body>
</html>
